<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>週間バーチカル空き時間調整</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans JP', 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-md shadow-indigo-100">
                    <i data-lucide="calendar" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 leading-tight">SyncVertical</h1>
                    <p class="text-xs text-slate-500">みんなの空き時間カンタン合わせ</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button onclick="openModal('participants-modal')" class="inline-flex items-center space-x-1.5 px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm font-medium transition">
                    <i data-lucide="users" class="w-4 h-4 text-slate-500"></i>
                    <span id="participant-count-badge">参加者 (0)</span>
                </button>
                <button onclick="openModal('ranking-modal')" class="inline-flex items-center space-x-1.5 px-3 py-2 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs sm:text-sm font-medium transition">
                    <i data-lucide="trophy" class="w-4 h-4 text-indigo-500"></i>
                    <span>候補日時</span>
                </button>
                <button onclick="shareEvent()" class="inline-flex items-center space-x-1.5 px-3.5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-medium shadow-sm transition">
                    <i data-lucide="share-2" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">共有</span>
                </button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col">
        
        <!-- コントロールバー / ユーザー設定 -->
        <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200/80 mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center space-x-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">あなたの名前:</label>
                    <input type="text" id="my-name-input" value="あなた" onchange="updateMyName(this.value)" class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 w-32 sm:w-40">
                </div>
                <div class="flex items-center space-x-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">カラー:</label>
                    <input type="color" id="my-color-input" value="#4f46e5" onchange="updateMyColor(this.value)" class="w-8 h-8 rounded-lg border border-slate-200 cursor-pointer p-0.5 bg-white">
                </div>
            </div>

            <div class="flex items-center justify-between md:justify-end gap-3 text-xs text-slate-500 bg-slate-50 px-3 py-2 rounded-xl border border-slate-100">
                <div class="flex items-center space-x-1.5">
                    <i data-lucide="info" class="w-4 h-4 text-indigo-500 shrink-0"></i>
                    <span>カレンダーをドラッグして空き時間を選択できます</span>
                </div>
                <button onclick="clearMySelection()" class="text-rose-600 hover:text-rose-700 font-medium underline shrink-0 ml-2">クリア</button>
            </div>
        </div>

        <!-- 週間バーチカルカレンダー本体 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden flex-1 flex flex-col">
            <div class="grid grid-cols-8 border-b border-slate-200 bg-slate-50 text-center sticky top-16 z-20 shadow-xs">
                <div class="py-3 px-1 text-xs font-bold text-slate-400 border-r border-slate-200 flex items-center justify-center">時間</div>
                <div class="py-3 px-1 border-r border-slate-200 last:border-r-0 day-header" data-day="0">
                    <div class="text-[11px] font-semibold text-slate-400">月</div>
                    <div class="text-sm font-bold text-slate-700 date-label">6/1</div>
                </div>
                <div class="py-3 px-1 border-r border-slate-200 last:border-r-0 day-header" data-day="1">
                    <div class="text-[11px] font-semibold text-slate-400">火</div>
                    <div class="text-sm font-bold text-slate-700 date-label">6/2</div>
                </div>
                <div class="py-3 px-1 border-r border-slate-200 last:border-r-0 day-header" data-day="2">
                    <div class="text-[11px] font-semibold text-slate-400">水</div>
                    <div class="text-sm font-bold text-slate-700 date-label">6/3</div>
                </div>
                <div class="py-3 px-1 border-r border-slate-200 last:border-r-0 day-header" data-day="3">
                    <div class="text-[11px] font-semibold text-slate-400">木</div>
                    <div class="text-sm font-bold text-slate-700 date-label">6/4</div>
                </div>
                <div class="py-3 px-1 border-r border-slate-200 last:border-r-0 day-header" data-day="4">
                    <div class="text-[11px] font-semibold text-slate-400">金</div>
                    <div class="text-sm font-bold text-slate-700 date-label">6/5</div>
                </div>
                <div class="py-3 px-1 border-r border-slate-200 last:border-r-0 day-header" data-day="5">
                    <div class="text-[11px] font-semibold text-sky-500">土</div>
                    <div class="text-sm font-bold text-sky-600 date-label">6/6</div>
                </div>
                <div class="py-3 px-1 border-r border-slate-200 last:border-r-0 day-header" data-day="6">
                    <div class="text-[11px] font-semibold text-rose-500">日</div>
                    <div class="text-sm font-bold text-rose-600 date-label">6/7</div>
                </div>
            </div>

            <div id="calendar-grid-container" class="overflow-y-auto max-h-[650px] relative select-none flex-1">
                <div id="calendar-grid" class="grid grid-cols-8 relative"></div>
            </div>
        </div>
    </main>

    <!-- モーダル類 -->
    <div id="participants-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 flex flex-col max-h-[80vh]">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                <h3 class="text-base font-bold text-slate-900 flex items-center space-x-2">
                    <i data-lucide="users" class="w-5 h-5 text-indigo-600"></i>
                    <span>参加者一覧 (<span id="modal-participant-count">0</span>)</span>
                </h3>
                <button onclick="closeModal('participants-modal')" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="py-4 space-y-3 overflow-y-auto flex-1" id="participants-list-container"></div>
            <div class="pt-4 border-t border-slate-100 flex justify-between items-center">
                <button onclick="addDemoParticipant()" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition flex items-center space-x-1.5">
                    <i data-lucide="user-plus" class="w-4 h-4"></i>
                    <span>参加者を追加</span>
                </button>
                <button onclick="closeModal('participants-modal')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold shadow-sm transition">閉じる</button>
            </div>
        </div>
    </div>

    <div id="ranking-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-100 flex flex-col max-h-[80vh]">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                <h3 class="text-base font-bold text-slate-900 flex items-center space-x-2">
                    <i data-lucide="trophy" class="w-5 h-5 text-indigo-600"></i>
                    <span>おすすめ日時ランキング</span>
                </h3>
                <button onclick="closeModal('ranking-modal')" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <p class="text-xs text-slate-500 pt-3">参加者全員の空き状況が重なっている時間帯の上位候補です。</p>
            <div class="py-3 space-y-2 overflow-y-auto flex-1" id="ranking-list-container"></div>
            <div class="pt-4 border-t border-slate-100 flex justify-end">
                <button onclick="closeModal('ranking-modal')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold shadow-sm transition">閉じる</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center space-x-2">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
        <span id="toast-message">リンクをコピーしました</span>
    </div>

    <script>
        const START_HOUR = 8;
        const END_HOUR = 22;
        const DAYS = ['月', '火', '水', '木', '金', '土', '日'];
        const DATES = ['6/1', '6/2', '6/3', '6/4', '6/5', '6/6', '6/7'];

        let myId = 'user_' + Math.random().toString(36).substr(2, 9);
        let myName = 'あなた';
        let myColor = '#4f46e5';
        let participants = {};
        let isMouseDown = false;
        let isSelecting = true;

        window.addEventListener('DOMContentLoaded', () => {
            participants[myId] = { name: myName, color: myColor, slots: new Set() };
            addPresetParticipants();
            renderCalendarGrid();
            updateAllUI();

            window.addEventListener('mouseup', () => {
                if (isMouseDown) {
                    isMouseDown = false;
                    saveMySlots();
                }
            });
            lucide.createIcons();
        });

        function addPresetParticipants() {
            const presets = [
                { id: 'p1', name: '佐藤さん', color: '#0ea5e9', slots: ['0-10-0', '0-10-1', '0-11-0', '0-11-1'] },
                { id: 'p2', name: '田中さん', color: '#10b981', slots: ['0-10-0', '0-10-1', '1-14-0', '1-14-1', '1-15-0'] },
                { id: 'p3', name: '鈴木さん', color: '#f59e0b', slots: ['0-10-0', '1-14-0', '2-16-0', '2-16-1'] }
            ];
            presets.forEach(p => {
                participants[p.id] = { name: p.name, color: p.color, slots: new Set(p.slots) };
            });
        }

        function renderCalendarGrid() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            for (let hour = START_HOUR; hour < END_HOUR; hour++) {
                for (let minute of [0, 30]) {
                    const timeCell = document.createElement('div');
                    timeCell.className = `h-10 border-b border-r border-slate-200 bg-slate-50/70 text-[11px] font-medium text-slate-400 flex items-center justify-center ${minute === 0 ? 'border-t border-t-slate-200 font-bold text-slate-500' : 'border-dashed'}`;
                    timeCell.textContent = minute === 0 ? `${hour}:00` : '';
                    grid.appendChild(timeCell);

                    for (let day = 0; day < 7; day++) {
                        const slotKey = `${day}-${hour}-${minute === 0 ? 0 : 1}`;
                        const cell = document.createElement('div');
                        cell.className = `h-10 border-b border-r border-slate-200 transition-colors relative cursor-pointer ${minute === 0 ? 'border-t border-t-slate-200' : 'border-dashed'}`;
                        cell.dataset.slot = slotKey;

                        cell.addEventListener('mousedown', (e) => {
                            e.preventDefault();
                            isMouseDown = true;
                            const mine = participants[myId].slots;
                            isSelecting = !mine.has(slotKey);
                            toggleSlotSelection(slotKey);
                        });

                        cell.addEventListener('mouseenter', () => {
                            if (isMouseDown) toggleSlotSelection(slotKey);
                        });

                        grid.appendChild(cell);
                    }
                }
            }
            updateGridVisuals();
        }

        function toggleSlotSelection(slotKey) {
            const mine = participants[myId].slots;
            if (isSelecting) mine.add(slotKey);
            else mine.delete(slotKey);
            updateGridVisuals();
        }

        function saveMySlots() {
            updateGridVisuals();
            updateParticipantUI();
        }

        function updateGridVisuals() {
            const cells = document.querySelectorAll('#calendar-grid [data-slot]');
            const totalParticipants = Object.keys(participants).length;

            cells.forEach(cell => {
                const slotKey = cell.dataset.slot;
                let availableUsers = [];
                for (let pid in participants) {
                    if (participants[pid].slots.has(slotKey)) availableUsers.push(participants[pid]);
                }

                cell.className = cell.className.replace(/bg-\S+/g, '').trim();
                const isMine = participants[myId].slots.has(slotKey);

                if (availableUsers.length > 0) {
                    if (totalParticipants === 1) {
                        cell.classList.add('bg-indigo-500');
                    } else {
                        const ratio = availableUsers.length / totalParticipants;
                        if (ratio > 0.7) cell.classList.add('bg-indigo-600');
                        else if (ratio > 0.4) cell.classList.add('bg-indigo-400');
                        else cell.classList.add('bg-indigo-200');
                    }
                } else if (isMine) {
                    cell.classList.add('bg-indigo-500');
                } else {
                    cell.classList.add('hover:bg-slate-100');
                }
            });
        }

        function updateMyName(newName) {
            myName = newName.trim() || '名無しさん';
            participants[myId].name = myName;
            updateParticipantUI();
        }

        function updateMyColor(newColor) {
            myColor = newColor;
            participants[myId].color = myColor;
            updateParticipantUI();
        }

        function clearMySelection() {
            participants[myId].slots.clear();
            updateGridVisuals();
            showToast('選択をクリアしました');
        }

        function updateAllUI() { updateParticipantUI(); }

        function updateParticipantUI() {
            const count = Object.keys(participants).length;
            document.getElementById('participant-count-badge').textContent = `参加者 (${count})`;
            document.getElementById('modal-participant-count').textContent = count;

            const container = document.getElementById('participants-list-container');
            container.innerHTML = '';

            for (let pid in participants) {
                const p = participants[pid];
                const isMe = pid === myId;
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100';
                item.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-4 h-4 rounded-full shadow-xs" style="background-color: ${p.color};"></span>
                        <div>
                            <span class="text-sm font-bold text-slate-800">${p.name}</span>
                            ${isMe ? '<span class="ml-2 px-1.5 py-0.5 bg-indigo-100 text-indigo-700 text-[10px] font-bold rounded">あなた</span>' : ''}
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-xs text-slate-500 font-medium">${p.slots.size}コマ選択</span>
                        ${!isMe ? `<button onclick="removeParticipant('${pid}')" class="text-slate-400 hover:text-rose-600 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                    </div>
                `;
                container.appendChild(item);
            }
            lucide.createIcons();
            updateGridVisuals();
            updateRanking();
        }

        function addDemoParticipant() {
            const demoNames = ['高橋さん', '渡辺さん', '伊藤さん', '山本さん', '中村さん'];
            const randomName = demoNames[Math.floor(Math.random() * demoNames.length)] + Math.floor(Math.random() * 10);
            const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            const demoId = 'demo_' + Math.random().toString(36).substr(2, 6);
            const demoSlots = new Set();
            for (let i = 0; i < 6; i++) {
                demoSlots.add(`${Math.floor(Math.random() * 7)}-${Math.floor(Math.random() * 6) + 10}-${Math.random() > 0.5 ? 0 : 1}`);
            }
            participants[demoId] = { name: randomName, color: randomColor, slots: demoSlots };
            updateParticipantUI();
            showToast(`${randomName}さんを追加しました`);
        }

        function removeParticipant(pid) {
            delete participants[pid];
            updateParticipantUI();
            showToast('参加者を削除しました');
        }

        function updateRanking() {
            const container = document.getElementById('ranking-list-container');
            container.innerHTML = '';
            const slotCounts = {};
            const totalParticipants = Object.keys(participants).length;

            for (let pid in participants) {
                participants[pid].slots.forEach(slotKey => {
                    slotCounts[slotKey] = (slotCounts[slotKey] || 0) + 1;
                });
            }

            const sortedSlots = Object.keys(slotCounts).map(slotKey => ({
                slotKey, count: slotCounts[slotKey]
            })).sort((a, b) => b.count - a.count);

            if (sortedSlots.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">まだ誰も空き時間を選択していません</p>';
                return;
            }

            sortedSlots.slice(0, 5).forEach((item, index) => {
                const [dayIndex, hour, minuteHalf] = item.slotKey.split('-').map(Number);
                const timeStr = `${hour}:${minuteHalf === 0 ? '00' : '30'}`;
                const endTimeStr = minuteHalf === 0 ? `${hour}:30` : `${hour + 1}:00`;
                let availableNames = [];
                for (let pid in participants) {
                    if (participants[pid].slots.has(item.slotKey)) availableNames.push(participants[pid].name);
                }

                const rankCard = document.createElement('div');
                rankCard.className = 'p-3 bg-slate-50 rounded-xl border border-slate-100 flex items-center justify-between';
                rankCard.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-7 h-7 rounded-lg bg-indigo-100 text-indigo-700 font-bold text-xs flex items-center justify-center shrink-0">${index + 1}位</div>
                        <div>
                            <div class="text-sm font-bold text-slate-800">${DATES[dayIndex]} (${DAYS[dayIndex]}) ${timeStr} - ${endTimeStr}</div>
                            <div class="text-[11px] text-slate-500 truncate max-w-[200px]">空き: ${availableNames.join(', ')}</div>
                        </div>
                    </div>
                    <div class="text-right shrink-0">
                        <span class="text-sm font-extrabold text-indigo-600">${item.count}</span>
                        <span class="text-xs text-slate-400">/${totalParticipants}人</span>
                    </div>
                `;
                container.appendChild(rankCard);
            });
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function shareEvent() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast('共有用URLをコピーしました！');
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => { toast.classList.add('translate-y-20', 'opacity-0'); }, 2500);
        }
    </script>
</body>
</html>
